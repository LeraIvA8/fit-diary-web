<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тренировка — Дневник тренировок</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/desktop.css" />
  </head>
  <body>
    <!-- Верхнее меню сайта (на телефоне вместо него нижнее меню) -->
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand">Дневник тренировок</a>
        <nav class="nav">
          <a href="/" class="active">Главная</a>
          <a href="/create.html">Создать</a>
          <a href="/profile.html">Профиль</a>
        </nav>
      </div>
    </header>

    <!-- Окно «Тренировка» (workout.html?id=15). Логика — js/workout.js, бэкенд — backend/routes/workout.py -->
    <main class="page">
      <a href="/" class="link">‹ Назад</a>
      <header class="head" style="margin-top: 20px">
        <div>
          <p class="eyebrow" id="date"></p>
          <h1 class="title" id="title"></h1>
        </div>
      </header>

      <div class="layout aside-right">
        <!-- Слева: упражнения -->
        <div class="cards two" id="exercises"></div>

        <!-- Справа: итог и действия -->
        <aside class="card stack sticky">
          <p class="label" style="margin: 0">Тренировка</p>
          <p class="muted" id="meta" style="margin: 0 0 8px"></p>
          <button class="btn" id="complete"></button>
          <a class="btn outline" id="edit">Изменить тренировку</a>
          <button class="btn text" id="delete">Удалить тренировку</button>
        </aside>
      </div>
    </main>
    <script type="module" src="/js/workout.js"></script>
  </body>
</html>
