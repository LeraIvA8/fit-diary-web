<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Главная — Дневник тренировок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/desktop.css" />
</head>

<body>
  <!-- Верхнее меню сайта (на телефоне вместо него нижнее меню) -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">Дневник тренировок</a>
      <nav class="nav">
        <a href="/" class="active">Главная</a>
        <a href="/create.html">Создать</a>
        <a href="/profile.html">Профиль</a>
      </nav>
    </div>
  </header>

  <!-- Окно «Главная». Логика — js/home.js, бэкенд — backend/routes/home.py -->
  <main class="page">
    <header class="head">
      <div>
        <p class="eyebrow">Дневник тренировок</p>
        <h1 class="title" id="name"></h1>
      </div>
      <a href="/profile.html" class="avatar" id="avatar"></a>
    </header>

    <div class="layout home">
      <!-- Слева: календарь -->
      <section class="card">
        <div class="head" style="align-items: center; margin-bottom: 40px">
          <h2 class="title" id="month"></h2>
          <div style="display: flex; gap: 12px">
            <button class="round" id="prev">&lsaquo;</button>
            <button class="round" id="next">&rsaquo;</button>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>
      </section>

      <!-- Справа: тренировки выбранного дня и ближайшие тренировки -->
      <section>
        <div class="section" id="day-head">
          <h2 class="title small" id="day-title"></h2>
        </div>
        <div class="stack" id="day"></div>

        <div class="section">
          <h2 class="title small">Ближайшие тренировки</h2>
          <a href="/create.html" class="link">+ Создать</a>
        </div>
        <div class="stack" id="upcoming"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/js/home.js"></script>
</body>

</html>
